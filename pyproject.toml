[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ood-detection-study"
version = "0.1.0"
description = "Reproducible post-hoc OOD detection study on CIFAR images"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "torchvision>=0.18", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
